<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FDIC Peer Analytics</title>
<!-- GitHub Pages serves index.html at the site root. The dashboard keeps its
     own filename so it stays recognisable when downloaded, so this page just
     forwards to it. -->
<meta http-equiv="refresh" content="0; url=FDIC_Peer_Dashboard.html">
<link rel="canonical" href="FDIC_Peer_Dashboard.html">
<style>
  :root{color-scheme:light dark}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    background:#f4f5f3; color:#0b0b0b;
    display:grid; place-items:center; min-height:100vh; margin:0; padding:24px;
  }
  @media (prefers-color-scheme:dark){ body{background:#0d0d0d; color:#fff} }
  .card{
    max-width:520px; text-align:center;
    border:1px solid rgba(11,11,11,.26); background:#fcfcfb; padding:28px 26px;
  }
  @media (prefers-color-scheme:dark){
    .card{background:#1a1a19; border-color:rgba(255,255,255,.28)}
  }
  h1{font-size:17px; margin:0 0 6px; letter-spacing:-.01em}
  p{font-size:13px; line-height:1.55; margin:0 0 18px; opacity:.75}
  a.go{
    display:inline-block; background:#14202e; color:#f4f5f3; text-decoration:none;
    font-size:11px; font-weight:650; letter-spacing:.07em; text-transform:uppercase;
    padding:9px 16px;
  }
  @media (prefers-color-scheme:dark){ a.go{background:#dfe6ee; color:#0b1119} }
  .meta{
    font-family:"IBM Plex Mono","Cascadia Mono",Consolas,monospace;
    font-size:10px; letter-spacing:.06em; text-transform:uppercase;
    margin-top:18px; opacity:.5;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>FDIC Peer Analytics</h1>
    <p>Opening the dashboard. If it does not load automatically, use the link below.</p>
    <a class="go" href="FDIC_Peer_Dashboard.html">Open dashboard</a>
    <div class="meta">Live FDIC Call Report data · api.fdic.gov</div>
  </div>
  <script>location.replace('FDIC_Peer_Dashboard.html');</script>
</body>
</html>
